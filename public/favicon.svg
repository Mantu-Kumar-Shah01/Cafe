<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1512" />
      <stop offset="100%" stop-color="#2D1D18" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D98A5B" />
      <stop offset="50%" stop-color="#C26D47" />
      <stop offset="100%" stop-color="#9E4D2A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#C26D47" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.3" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.6"/>

  <!-- Coffee Bean & Steam Emblem -->
  <g transform="translate(0, 8)" filter="url(#glow)">
    <!-- Left Half of Coffee Bean -->
    <path d="M228 140 C140 180 130 330 220 370 C240 378 250 360 242 345 C210 290 210 220 236 155 C242 142 236 136 228 140 Z" fill="url(#goldGrad)" />
    
    <!-- Right Half of Coffee Bean -->
    <path d="M284 140 C372 180 382 330 292 370 C272 378 262 360 270 345 C302 290 302 220 276 155 C270 142 276 136 284 140 Z" fill="url(#goldGrad)" />
    
    <!-- Central S-Curve Steam Line -->
    <path d="M256 380 C230 310 282 230 256 120 C248 85 272 60 272 60 C272 60 260 80 264 100 C276 160 236 250 256 380 Z" fill="#E8AA84" opacity="0.95" />
  </g>
</svg>